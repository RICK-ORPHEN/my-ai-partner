name: Server certificate trust security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tls-trust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ["web"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: node scripts/verify-tls-trust.mjs
        working-directory: ${{ matrix.app }}
